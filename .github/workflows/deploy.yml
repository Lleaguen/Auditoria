name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: audit/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # URLs de cada planta — configurar en GitHub → Settings → Variables → Actions
          # NEXT_PUBLIC_API_URL_CIU → https://IP_de_soldati  (ej: https://192.168.67.121)
          # NEXT_PUBLIC_API_URL_EEV → https://IP_de_echeverria
          NEXT_PUBLIC_API_URL_CIU: ${{ vars.API_URL_CIU }}
          NEXT_PUBLIC_API_URL_EEV: ${{ vars.API_URL_EEV }}

          # API Keys por planta — configurar en GitHub → Settings → Secrets → Actions
          # Deben coincidir exactamente con API_KEY_CIU / API_KEY_EEV del .env del backend
          NEXT_PUBLIC_API_KEY_CIU: ${{ secrets.API_KEY_CIU }}
          NEXT_PUBLIC_API_KEY_EEV: ${{ secrets.API_KEY_EEV }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: audit/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
