name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    defaults:
      run:
        working-directory: audit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: audit/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL_CIU: ${{ secrets.API_URL_CIU }}
          NEXT_PUBLIC_API_URL_EEV: ${{ secrets.API_URL_EEV }}

      - name: Verify env vars were set
        run: |
          if [ -z "$NEXT_PUBLIC_API_URL_CIU" ]; then echo "ERROR: NEXT_PUBLIC_API_URL_CIU is empty"; else echo "OK: NEXT_PUBLIC_API_URL_CIU is set"; fi
          if [ -z "$NEXT_PUBLIC_API_URL_EEV" ]; then echo "ERROR: NEXT_PUBLIC_API_URL_EEV is empty"; else echo "OK: NEXT_PUBLIC_API_URL_EEV is set"; fi
        env:
          NEXT_PUBLIC_API_URL_CIU: ${{ secrets.API_URL_CIU }}
          NEXT_PUBLIC_API_URL_EEV: ${{ secrets.API_URL_EEV }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: audit/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
