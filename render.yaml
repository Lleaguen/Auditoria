services:
  - type: web
    name: audit-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: BACKUP_CRON
        value: "0 10 * * *"
      - key: BACKUP_EMAIL_TO
        value: franco.nahuel.romero@ocasa.com
      - key: BACKUP_EMAIL_FROM
        value: onboarding@resend.dev
      - key: DB_HOST
        fromDatabase:
          name: audit-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: audit-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: audit-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: audit-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: audit-db
          property: password

databases:
  - name: audit-db
    databaseName: audit_db
    user: audit_user
    plan: free
