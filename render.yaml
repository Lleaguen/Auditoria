services:
  - type: web
    name: audit-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: BACKUP_CRON
        value: "0 10 * * *"
      - key: BACKUP_EMAIL_TO
        value: franco.nahuel.romero@ocasa.com
      - key: BACKUP_EMAIL_FROM
        value: onboarding@resend.dev
