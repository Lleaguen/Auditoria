services:
  - type: web
    name: audit-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        generateValue: false   # Render lo asigna automáticamente
      - key: JWT_SECRET
        generateValue: true    # Render genera un valor aleatorio seguro
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: ALLOWED_ORIGIN
        sync: false            # Lo ponés manualmente en el dashboard
      - key: DB_HOST
        fromDatabase:
          name: audit-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: audit-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: audit-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: audit-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: audit-db
          property: password
      - key: API_KEY_CIU
        sync: false            # Lo ponés manualmente en el dashboard
      - key: API_KEY_EEV
        sync: false            # Lo ponés manualmente en el dashboard
      - key: BACKUP_CRON
        value: "0 10 * * *"
      - key: RESEND_API_KEY
        sync: false            # Lo ponés manualmente en el dashboard
      - key: BACKUP_EMAIL_TO
        value: franco.nahuel.romero@ocasa.com
      - key: BACKUP_EMAIL_FROM
        value: onboarding@resend.dev

databases:
  - name: audit-db
    databaseName: audit_db
    user: audit_user
    plan: free
